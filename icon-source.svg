<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14141f"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- sound wave bars forming an "M" shape -->
  <g fill="url(#accent)">
    <rect x="108" y="216" width="34" height="120" rx="17"/>
    <rect x="166" y="176" width="34" height="200" rx="17"/>
    <rect x="224" y="140" width="34" height="272" rx="17"/>
    <rect x="282" y="176" width="34" height="200" rx="17"/>
    <rect x="340" y="216" width="34" height="120" rx="17"/>
  </g>

  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.25"/>
</svg>
