<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252820"/>
      <stop offset="100%" stop-color="#1a1c18"/>
    </linearGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d4860a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="88" fill="none" stroke="#3d4038" stroke-width="4"/>

  <!-- scanline texture -->
  <rect width="512" height="512" rx="96" fill="url(#scan)" opacity="0.5"/>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- signal waves -->
  <g stroke="#72ff76" stroke-width="6" fill="none" opacity="0.85">
    <path d="M 300 165 A 60 60 0 0 1 355 225"/>
    <path d="M 300 130 A 100 100 0 0 1 390 225"/>
    <path d="M 300 95  A 140 140 0 0 1 425 225"/>
  </g>

  <!-- satellite dish -->
  <g transform="translate(96,255)">
    <path d="M0 120 C 0 40, 90 -20, 200 0 C 130 10, 60 55, 40 120 Z" fill="url(#dish)"/>
    <path d="M0 120 C 0 40, 90 -20, 200 0" fill="none" stroke="#7a4e08" stroke-width="5"/>
    <circle cx="46" cy="108" r="10" fill="#1a1c18"/>
    <!-- feed arm -->
    <path d="M120 40 L 176 -46" stroke="#c8cbbe" stroke-width="10" stroke-linecap="round"/>
    <circle cx="180" cy="-54" r="16" fill="#c8cbbe"/>
    <!-- stand -->
    <path d="M40 120 L 10 210 M40 120 L 70 210" stroke="#4e5247" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- base terminal bar -->
  <rect x="72" y="380" width="368" height="64" rx="10" fill="#1a1c18" stroke="#3d4038" stroke-width="3"/>
  <text x="256" y="422" font-family="'Courier New', monospace" font-size="30" font-weight="700" fill="#f5a623" text-anchor="middle" letter-spacing="4">MOJIOKO</text>
</svg>
